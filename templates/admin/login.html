{% extends 'admin/base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block publico %}
<div class="acceso">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <img src="{{ url_for('static', filename='img/logo-256.png') }}" alt="" width="96" height="96" class="logo-circulo d-block mx-auto mb-2">
      <h1 class="h4 text-center mb-1">ISMAR</h1>
      <p class="text-center text-muted mb-4">Panel de administrador</p>
      {% include 'admin/_mensajes.html' %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label class="form-label">Usuario o correo</label>
          <input name="usuario" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-dark w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
