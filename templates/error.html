{# Página de error independiente: no usa base.html ni la base de datos, para que se vea
   incluso si la falla es justamente que MySQL no responde #}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} · Eléctricos Ismar</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tienda.css') }}">
</head>
<body>
  <header class="barra py-2">
    <div class="container">
      <a href="{{ url_for('inicio') }}" class="marca-logo text-decoration-none">
        <img src="{{ url_for('static', filename='img/logo-160.png') }}" alt="" class="logo-circulo" width="44" height="44">
        <span class="marca-texto"><small>Eléctricos</small>ISMAR</span>
      </a>
    </div>
  </header>
  <main class="container">
    <div class="vacio">
      <i class="bi bi-{{ icono }}"></i>
      <h1 class="h4 fw-bold">{{ titulo }}</h1>
      <p class="mb-3">{{ mensaje }}</p>
      <a href="{{ enlace or url_for('inicio') }}" class="btn btn-acento">{{ enlace_texto or 'Volver al inicio' }}</a>
    </div>
  </main>
</body>
</html>
